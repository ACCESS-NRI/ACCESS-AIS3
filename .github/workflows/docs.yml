name: Build and publish documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build Sphinx site
        run: sphinx-build -b html docs/source _build/html

      - name: Package site and development record
        run: |
          mkdir -p _site
          cp -a _build/html/. _site/
          cp docs/index.html _site/development-record.html
          cp -a docs/figures _site/figures
          cp docs/inversion_worklog.md docs/post_inversion_pipeline_worklog.md docs/run_guide.md _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4